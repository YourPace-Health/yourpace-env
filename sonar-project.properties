# SonarQube Project Configuration
sonar.projectKey=yourpace-project
sonar.projectName=YourPace
sonar.projectVersion=1.0

# Path to the source directories
sonar.sources=backend,frontend/src

# Exclusions to prevent scanning of dependencies and binaries
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/.git/**, **/*.min.js, **/package-lock.json, **/coverage/**, **/youpace.exe, backend/youpace_test.exe, frontend/build/**

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Memory optimization for JavaScript/TypeScript Sensor
sonar.javascript.node.maxspace=4096