# SonarQube Project Configuration
sonar.projectKey=yourpace-project
sonar.projectName=YourPace
sonar.projectVersion=1.0

# Path to the source directories
sonar.sources=backend,frontend/src

# Exclusions to prevent scanning of dependencies, binaries, legacy monolith, and generated files
sonar.exclusions=**/node_modules/**, **/dist/**, **/build/**, **/.git/**, **/*.min.js, **/package-lock.json, **/coverage/**, **/*.exe, **/*.dll, **/*.so, **/*.dylib, **/.scannerwork/**, **/n8n_data/**, backend/uploads/**, **/lint-results.json, frontend/src/assets/**, frontend/src/data/**, frontend/src/App.jsx

# Coverage reporting configuration - targeting core business logic & middleware
sonar.go.coverage.reportPaths=backend/coverage.out
sonar.coverage.exclusions=**/*_test.go, frontend/**, backend/config/**, backend/models/**, backend/main.go, backend/handlers/**, backend/services/gemini.go, backend/services/otp.go

# Duplication exclusions
sonar.cpd.exclusions=frontend/**, backend/models/**, backend/handlers/**, **/*_test.go

# Disable SCM ignore so all project sources are indexed properly in container
sonar.scm.disabled=true

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Memory optimization for JavaScript/TypeScript Sensor
sonar.javascript.node.maxspace=4096

# Go analysis properties
sonar.go.exclusions=**/*_test.go, **/vendor/**

# Issue Filtering - suppress non-critical code smells across project
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8

# 1. Ignore duplicate string literals in Go handlers
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*

# 2. Ignore cognitive complexity in Go
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S3776
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*

# 3. Ignore JavaScript cognitive complexity
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*

# 4. Ignore JSX accessibility attributes in views
sonar.issue.ignore.multicriteria.e4.ruleKey=javascript:S6853
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*

# 5. Ignore nested ternary in views
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*

# 6. Ignore boolean redundancy in views
sonar.issue.ignore.multicriteria.e6.ruleKey=javascript:S9011
sonar.issue.ignore.multicriteria.e6.resourceKey=**/*

# 7. Ignore generic catch handling in frontend
sonar.issue.ignore.multicriteria.e7.ruleKey=javascript:S2486
sonar.issue.ignore.multicriteria.e7.resourceKey=**/*

# 8. Ignore parseInt/parseFloat suggestion
sonar.issue.ignore.multicriteria.e8.ruleKey=javascript:S7773
sonar.issue.ignore.multicriteria.e8.resourceKey=**/*